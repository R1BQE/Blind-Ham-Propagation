# Blind-Ham-Propagation production Apache fragment.
# Include from the existing HTTPS VirtualHost for blind-ham.ru.
# The release manager switches /var/www/html/blind-prop/current atomically.
# Required modules: alias, dir, headers, proxy, proxy_http, proxy_wstunnel.

Alias /prop/ /var/www/html/blind-prop/current/frontend/

<Directory /var/www/html/blind-prop/current/frontend/>
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    AddType application/manifest+json .webmanifest
</Directory>

RedirectMatch 301 ^/prop$ /prop/

# Deny access to project internals, even if a future release adds such files.
<LocationMatch "^/prop/.*(\.git|\.venv|\.env|\.ini|\.py|\.pyc|\.sqlite3?|\.db|\.log|\.bak|\.tar|\.gz|\.zip|~)$">
    Require all denied
</LocationMatch>

<LocationMatch "^/prop/(data|logs|backups|deploy|tests|scripts|docs|backend|\.git|\.venv)(/|$)">
    Require all denied
</LocationMatch>

# Keep the PSK Reporter WebSocket route ahead of the general API proxy.
ProxyPass        /prop/api/v1/psk-reporter/session ws://127.0.0.1:8765/api/v1/psk-reporter/session
ProxyPassReverse /prop/api/v1/psk-reporter/session ws://127.0.0.1:8765/api/v1/psk-reporter/session

ProxyPass        /prop/api/ http://127.0.0.1:8765/api/ retry=0 timeout=60
ProxyPassReverse /prop/api/ http://127.0.0.1:8765/api/

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Prefix "/prop"

<IfModule mod_headers.c>
    <LocationMatch "^/prop/">
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </LocationMatch>
</IfModule>
