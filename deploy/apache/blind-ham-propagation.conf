# Enable the required Apache modules:
# a2enmod proxy proxy_http headers
#
# Include these directives in the existing HTTPS VirtualHost for blind-ham.ru.
# Adjust the filesystem path and local Uvicorn port to the deployment environment.
#
# Apache serves the PWA files directly. Only API requests are proxied.
Alias /prop/ /var/www/blind-ham-propagation/frontend/

<Directory /var/www/blind-ham-propagation/frontend/>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
</Directory>

ProxyPreserveHost On
ProxyPass        /prop/api/ http://127.0.0.1:8000/api/
ProxyPassReverse /prop/api/ http://127.0.0.1:8000/api/

<IfModule mod_headers.c>
    <Location /prop/>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Location>
</IfModule>
