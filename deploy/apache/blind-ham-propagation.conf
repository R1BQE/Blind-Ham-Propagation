# Blind-Ham-Propagation: /prop/
# Подключается одной строкой Include в VirtualHost blind-ham.ru (443).

Alias /prop/ /var/www/html/blind-prop/frontend/

<Directory /var/www/html/blind-prop/frontend/>
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    AddType application/manifest+json .webmanifest
</Directory>

RedirectMatch 301 ^/prop$ /prop/

# Защита служебных файлов и конфигурации.
<LocationMatch "^/prop/.*(\.git|\.venv|\.env|\.ini|\.py|\.pyc|\.sqlite3?|\.db|\.log|\.bak|\.tar|\.gz|\.zip|~)$">
    Require all denied
</LocationMatch>

# Файлы зависимостей и конфигурация сборки нужны серверу, но не браузеру.
<LocationMatch "^/prop/(requirements[^/]*\.(txt|lock)|pyproject\.toml)(/|$)">
    Require all denied
</LocationMatch>

# Закрываем служебные каталоги проекта.
<LocationMatch "^/prop/(data|logs|backups|deploy|tests|scripts|docs|backend|\.git|\.venv)(/|$)">
    Require all denied
</LocationMatch>

# WebSocket PSK Reporter.
ProxyPass        /prop/api/v1/psk-reporter/session ws://127.0.0.1:8765/api/v1/psk-reporter/session
ProxyPassReverse /prop/api/v1/psk-reporter/session ws://127.0.0.1:8765/api/v1/psk-reporter/session

# HTTP API.
ProxyPass        /prop/api/ http://127.0.0.1:8765/api/ retry=0 timeout=60
ProxyPassReverse /prop/api/ http://127.0.0.1:8765/api/

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Prefix "/prop"

<IfModule mod_headers.c>
    <LocationMatch "^/prop/">
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </LocationMatch>
</IfModule>
