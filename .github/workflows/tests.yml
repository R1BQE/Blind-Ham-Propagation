name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: find frontend -type f -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: pytest

  vds-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vds.lock

      - name: Check deployment script syntax
        run: bash -n scripts/bp scripts/install_vds.sh

      - name: Install pinned VDS dependencies
        run: python -m pip install -r requirements-vds.lock

      - name: Install application without resolving new dependencies
        run: python -m pip install --no-deps --no-build-isolation .

      - name: Run tests in the pinned VDS environment
        run: python -m pytest
